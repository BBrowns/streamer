version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; keep TypeScript 6
      # maintenance updates flowing automatically.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # Expo SDK 58 uses the validated React Native 0.88.x line. Keep patches
      # reviewable while holding the next native/tooling migration.
      - dependency-name: react-native
        versions:
          - ">=0.89.0"
      - dependency-name: "@react-native/metro-config"
        versions:
          - ">=0.89.0"
      - dependency-name: "@react-native/jest-preset"
        versions:
          - ">=0.89.0"
      # SDK 58's native adapter and Reanimated 4.7 use Worklets 0.13.x;
      # review the next Worklets/Reanimated lines together.
      - dependency-name: react-native-worklets
        versions:
          - ">=0.14.0"
      - dependency-name: react-native-reanimated
        versions:
          - ">=4.8.0"
      # Keep the validated Jest 30 line with the SDK 58 / RN 0.88 presets;
      # a Jest major requires a coordinated test-toolchain migration.
      - dependency-name: jest
        versions:
          - ">=31.0.0"
      - dependency-name: "@types/jest"
        versions:
          - ">=31.0.0"
      # NativeWind 4.2.x has a Tailwind 3 peer contract; Tailwind 4 needs a
      # coordinated NativeWind migration instead of an isolated bot bump.
      - dependency-name: tailwindcss
        versions:
          - ">=4.0.0"
      # xcode@3.0.1 still calls the CommonJS UUID API; review a future major
      # explicitly after the current root uuid14 + nested uuid11 arrangement.
      - dependency-name: uuid
        versions:
          - ">=15.0.0"
    groups:
      npm-vitest-manual:
        # Coverage providers require the exact Vitest version, including majors.
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-security-runtime:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-framework-manual:
        # These updates can change native/runtime contracts and always need a
        # focused migration review, even when the version bump is small.
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "@expo-*/*"
          - "react"
          - "react-*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@react-native-*/*"
          - "@types/react*"
          - "@tanstack/react-*"
          - "@testing-library/react-*"
          - "electron"
          - "electron-*"
          - "@electron/*"
          - "jest"
          - "jest-*"
          - "@types/jest"
          - "@prisma/*"
          - "prisma"
          - "typescript"
          - "@typescript-eslint/*"
          - "@sentry/*"
          - "@hono/*"
          - "hono"
          - "@scalar/hono-*"
          - "nativewind"
          - "tailwindcss"
          - "esbuild"
          - "@rollup/*"
          - "sharp"
          - "*sqlite*"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker-compose
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    groups:
      docker-compose-patch:
        patterns:
          - "*"
        update-types:
          - patch
