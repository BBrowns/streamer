version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; keep TypeScript 6
      # maintenance updates flowing automatically.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # Expo SDK 57 remains pinned to the validated React Native 0.86.2 line.
      - dependency-name: react-native
        versions:
          - ">=0.87.0"
      # Expo SDK 57 also pins the React Native tooling packages to 0.86.x;
      # Metro 0.87 pulls image-size advisories that are not safe to allow.
      - dependency-name: "@react-native/metro-config"
        versions:
          - ">=0.87.0"
      - dependency-name: "@react-native/jest-preset"
        versions:
          - ">=0.87.0"
      # NativeWind 4.2.x has a Tailwind 3 peer contract; Tailwind 4 needs a
      # coordinated NativeWind migration instead of an isolated bot bump.
      - dependency-name: tailwindcss
        versions:
          - ">=4.0.0"
      # xcode@3.0.1 still calls the CommonJS UUID API; review a future major
      # explicitly after the current root uuid14 + nested uuid11 arrangement.
      - dependency-name: uuid
        versions:
          - ">=15.0.0"
    groups:
      npm-security-runtime:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-framework-manual:
        # These updates can change native/runtime contracts and always need a
        # focused migration review, even when the version bump is small.
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "electron"
          - "@prisma/*"
          - "prisma"
          - "typescript"
          - "@typescript-eslint/*"
          - "@sentry/*"
          - "@hono/*"
          - "nativewind"
          - "tailwindcss"
          - "esbuild"
          - "@rollup/*"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    groups:
      docker-compose-patch:
        patterns:
          - "*"
        update-types:
          - patch
