version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # Expo SDK 57 remains pinned to the validated React Native 0.86.2 line.
      - dependency-name: react-native
        versions:
          - ">=0.87.0"
      # xcode's CommonJS UUID integration is covered by the repository's 11.x pin.
      - dependency-name: uuid
        versions:
          - ">=12.0.0"
    groups:
      npm-security-runtime:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - patch
