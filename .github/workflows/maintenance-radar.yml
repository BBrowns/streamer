name: Maintenance Radar

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: maintenance-radar
  cancel-in-progress: true

env:
  NPM_VERSION: "12.0.2"

jobs:
  radar:
    name: Collect maintenance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate maintenance report
        run: >-
          npx --yes "npm@${NPM_VERSION}" run maintenance:report --
          --since-days 7
          --output artifacts/maintenance-radar/report.md
          --json-output artifacts/maintenance-radar/report.json

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f artifacts/maintenance-radar/report.md ]; then
            cat artifacts/maintenance-radar/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Maintenance report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-radar-report
          path: artifacts/maintenance-radar/
          if-no-files-found: warn
          retention-days: 30
