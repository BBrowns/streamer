name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag or release name, for example v0.1.0-rc.1"
        required: true
        type: string
      build_channel:
        description: "Build channel"
        required: true
        default: "rc"
        type: choice
        options:
          - rc
          - production
      notarize:
        description: "Run Apple notarization after signing (required for production)"
        required: true
        default: false
        type: boolean
      draft_release:
        description: "Create or update a draft GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  NPM_VERSION: "12.0.2"

jobs:
  validate-dispatch:
    name: Validate release dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      dispatch_sha: ${{ steps.validate.outputs.dispatch_sha }}
    steps:
      - name: Validate release ref, tag, and channel policy
        id: validate
        env:
          RELEASE_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_CHANNEL: ${{ inputs.build_channel }}
          RELEASE_NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" != "refs/heads/master" ]]; then
            echo "::error::Desktop releases must be dispatched from the protected master branch."
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag_name must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi
          if [[ "${RELEASE_CHANNEL}" == "production" && "${RELEASE_NOTARIZE}" != "true" ]]; then
            echo "::error::Production releases require Apple notarization."
            exit 1
          fi
          echo "dispatch_sha=${DISPATCH_SHA}" >> "${GITHUB_OUTPUT}"

  macos-release:
    name: macOS Release Artifact
    needs: validate-dispatch
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.build_channel == 'production' && 'production' || 'release-candidate' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: desktop-release-${{ inputs.tag_name }}
      cancel-in-progress: false
    env:
      STREAMER_BUILD_CHANNEL: ${{ inputs.build_channel }}
      STREAMER_BUILD_ENVIRONMENT: production
      STREAMER_NOTARIZE: ${{ inputs.notarize }}
      STREAMER_RELEASE_TAG: ${{ inputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-dispatch.outputs.dispatch_sha }}
          persist-credentials: false

      - name: Stamp protected source revision
        env:
          EXPECTED_SHA: ${{ needs.validate-dispatch.outputs.dispatch_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          echo "STREAMER_GIT_SHA=${actual_sha}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies with the reviewed lifecycle policy
        run: node scripts/ci-install.mjs

      - name: Stamp build metadata
        run: |
          streamer_app_version="$(node --print 'require("./package.json").version')"
          echo "STREAMER_APP_VERSION=${streamer_app_version}" >> "$GITHUB_ENV"
          echo "STREAMER_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Generate production SBOM
        run: npm run release:sbom -- --output artifacts/release/sbom.spdx.json

      - name: Validate release configuration
        run: npm run release:check --workspace=@streamer/desktop

      - name: Validate release ref, tag, and channel policy
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_CHANNEL: ${{ inputs.build_channel }}
          RELEASE_NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" != "refs/heads/master" ]]; then
            echo "::error::Desktop releases must be dispatched from the protected master branch."
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag_name must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi
          if [[ "${RELEASE_CHANNEL}" == "production" && "${RELEASE_NOTARIZE}" != "true" ]]; then
            echo "::error::Production releases require Apple notarization."
            exit 1
          fi

      - name: Validate signing and notarization secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$CSC_NAME" ]; then
            echo "::error::MACOS_CSC_LINK or MACOS_CSC_NAME is required for a desktop release build."
            exit 1
          fi

          if [ "$STREAMER_NOTARIZE" = "true" ]; then
            if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              exit 0
            fi
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              exit 0
            fi
            echo "::error::Notarization requires Apple API key secrets or Apple ID app-specific password secrets."
            exit 1
          fi

      - name: Build signed macOS release artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac:release --workspace=@streamer/desktop

      - name: Validate release artifact inventory
        run: |
          test -d apps/desktop/release
          find apps/desktop/release -maxdepth 2 -type f \( -name "*.dmg" -o -name "*.zip" \) -print | tee artifacts.txt
          test -s artifacts.txt

      - name: Write release notes draft
        run: |
          mkdir -p artifacts/release
          cat > artifacts/release/release-notes.md <<EOF
          # Streamer Desktop ${STREAMER_RELEASE_TAG}

          - Version: ${STREAMER_APP_VERSION}
          - Git SHA: ${STREAMER_GIT_SHA}
          - Build date: ${STREAMER_BUILD_DATE}
          - Channel: ${STREAMER_BUILD_CHANNEL}
          - macOS artifacts: DMG and ZIP from \`apps/desktop/release\`
          - Production SBOM: \`artifacts/release/sbom.spdx.json\`
          - Notarization requested: ${STREAMER_NOTARIZE}

          ## QA Evidence

          Complete the QA matrix and RC checklist before marking this release ready.

          - docs/QA_MATRIX.md
          - docs/RC_CHECKLIST.md
          EOF

      - name: Attest macOS release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.zip
            artifacts/release/sbom.spdx.json

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamer-desktop-macos-release
          path: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.zip
            artifacts/release/sbom.spdx.json
            artifacts/release/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Streamer Desktop ${{ inputs.tag_name }}
          draft: true
          prerelease: ${{ inputs.build_channel != 'production' }}
          body_path: artifacts/release/release-notes.md
          files: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.zip
