<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streamer could not start</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fbf6f4;
        color: #241f20;
      }
      body {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      main {
        max-width: 520px;
        padding: 32px;
        border: 1px solid #d8ccca;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 18px 50px rgba(36, 31, 32, 0.12);
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; line-height: 1.55; }
      @media (prefers-color-scheme: dark) {
        :root { background: #171516; color: #f8efed; }
        main { border-color: #4e4445; background: rgba(37, 32, 33, 0.92); }
      }
    </style>
  </head>
  <body>
    <main role="alert" aria-live="assertive">
      <h1>Streamer could not start</h1>
      <p>The desktop interface is not available in this build. Please restart the app or install a fresh build.</p>
    </main>
  </body>
</html>
